<header class="top"><div class="brand"><div class="sigil"><i></i></div><div class="title"><b>回路地牢</b><span>战术白盒 / 十房探索</span></div></div><div class="stats"><div class="chip">生命 <strong id="life">100</strong></div><div class="chip">回路 <strong id="circuit">100</strong></div><div class="chip currency">金币 <strong id="coins">0</strong></div><div class="chip kills">击破 <strong id="kills">0</strong></div></div></header>

<script data-source="deck-core.js">
(function(root){
 'use strict';
 const kinds=[
  {id:'attack',name:'攻击牌',description:'前方攻击，造成 24 点伤害',cd:2.5,color:'#f3a35d'},
  {id:'defense',name:'防御牌',description:'获得 20 点护盾',cd:6,color:'#6ebbd1'},
  {id:'move',name:'位移牌',description:'向目标方向位移 4 格',cd:4,color:'#b8cc78'},
  {id:'single',name:'一次性卡牌',description:'造成 60 点伤害，使用后本场耗尽',cd:6,color:'#df83a7'},
  {id:'debuff',name:'debuff牌',description:'使目标减速 50%，持续 3 秒',cd:5,color:'#b09ddd'}
 ];
 const labels={attack:'攻击',defense:'防御',move:'位移',single:'一次性',debuff:'debuff'};
 const limit=5;
 function effects(card){
  const input=Array.isArray(card.traits)?card.traits:[card.kind];
  const traits=kinds.filter(k=>input.includes(k.id)).map(k=>k.id);
  return traits.length?traits:[kinds.some(k=>k.id===card.kind)?card.kind:'attack'];
 }
 function spec(card){
  const traits=effects(card),level=Math.min(2,Math.max(0,Math.floor(Number(card.level)||0))),scale=1+.25*level;
  const baseName=traits.length===1?kinds.find(k=>k.id===traits[0]).name:traits.map(t=>labels[t]).join('·')+'牌';
  const has=t=>traits.includes(t);
  return {...card,kind:has(card.kind)?card.kind:traits[0],traits,spliced:Boolean(card.spliced||traits.length>1),level,
   name:baseName+(level?' +'+level:''),baseName,cd:Math.max(...kinds.filter(k=>has(k.id)).map(k=>k.cd)),
   damage:((has('attack')?24:0)+(has('single')?60:0))*scale,shield:(has('defense')?20:0)*scale,
   distance:(has('move')?4:0)*scale,slowDuration:(has('debuff')?3:0)*scale,slowRatio:has('debuff')?.5:0,
   exhaust:has('single'),cooldown:Math.max(0,Number(card.cooldown)||0)};
 }
 function defaults(){return kinds.flatMap((k,i)=>[0,1].map(n=>({id:'card-'+(i*2+n),kind:k.id,traits:[k.id],spliced:false,level:0})));}
 function shuffle(cards,rng=Math.random){
  const result=[...cards];
  for(let i=result.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
  return result;
 }
 function create(cards=defaults(),rng=Math.random,opening=false){
  const d={hand:[],candidates:[],draw:shuffle(cards.map(c=>spec({...c,level:0,cooldown:0})),rng),discard:[],exhausted:[],rng};
  if(opening)for(const kind of kinds){const index=d.draw.findIndex(c=>c.kind===kind.id);if(index>=0)d.hand.push(d.draw.splice(index,1)[0]);}
  while(d.hand.length<limit&&d.draw.length)d.hand.push(d.draw.pop());
  return d;
 }
 function indexIn(cards,index){return Number.isInteger(index)&&index>=0&&index<cards.length;}
 function drawOne(d,replaceIndex=-1){
  const replacing=d.candidates.length>=limit;
  if(replacing&&!indexIn(d.candidates,replaceIndex))return false;
  if(!d.draw.length&&!d.discard.length){
   // When every live card is already in a row, the selected candidate is the only recyclable card.
   if(!replacing)return false;
   return d.candidates[replaceIndex];
  }
  if(!d.draw.length){d.draw=shuffle(d.discard,d.rng);d.discard=[];}
  const card=d.draw.pop();
  if(replacing){d.discard.push(d.candidates[replaceIndex]);d.candidates[replaceIndex]=card;}
  else d.candidates.push(card);
  return card;

function newRun(){run=G.createRun();resetBattle();hero.hp=100;hero.shield=0;skills=[];enemies=[];battlefield=null;noticeText='';buildSelected=[];buildPreview=null;if(G.enter(run,G.available(run)[0].id))openEncounter();}
function openEncounter(){if(!run?.pending)return;const n=run.pending;if(n.type==='rest')showRest();else if(n.type==='event')showEvent();else startBattle();}
function battleNav(){auxiliary.innerHTML='<nav class="battle-nav"><button class="btn" data-action="view-deck">牌组 [B]</button><button class="btn ghost" data-action="pause">暂停</button></nav>';deckViewerOpen=false;viewerSignature='';}
function battleWon(){if(!G.win(run,hero.hp))return;resetBattle();deck=null;skills=[];showReward();}
function showReward(){
 if(!run?.reward)return;setScreen('reward');const n=run.pending;
 overlay.innerHTML=`<section class="modal-wrap"><div class="eyebrow">ROOM ${String(n.number).padStart(2,'0')} / CLEARED</div><h1>${n.boss?'守门者已倒下':'战斗完成'}</h1><p class="lead">${n.name} · 选择一张卡牌加入本次探索牌组。</p><div class="reward-money">+30 金币 · 当前余额 ${run.coins}</div><div class="reward-grid">${run.reward.map((base,i)=>{const c=Deck.spec(base);return `<button class="reward-card" data-reward="${c.id}" aria-label="选择奖励 ${c.name}"><div class="card-no">REWARD / 0${i+1}</div><b>${c.name}</b><p>${describeCard(c)}</p><small>加入牌组 · CD ${c.cd}s</small></button>`;}).join('')}</div><p class="lead">三选一 · 奖励可在下一场抽到${n.boss?' · 领取后结算通关':' · 领取后可先用金币整理牌组'}。</p></section>`;
}
function showCleared(){
 if(!run?.current)return;hero.hp=run.hp;hero.shield=0;setScreen('cleared');const n=run.current,doors=G.available(run);
 overlay.innerHTML=`<section class="modal-wrap"><div class="room-summary"><div><div class="eyebrow">ROOM ${String(n.number).padStart(2,'0')} / 10 · COMPLETE</div><h1>${n.name}</h1><p class="lead">${noticeText||'房间已完成，出口已经开启。'}</p></div><button class="btn" data-action="build">打开牌组 · 变牌 / 拼接 <kbd>B</kbd></button></div><p class="lead">选择下一扇门。离开前，可以花金币调整本次探索的牌组。</p><div class="door-grid">${doors.map(d=>`<button class="room-door" data-door="${d.id}" aria-label="进入第 ${d.number} 房 ${roomLabels[d.type]}"><span class="door-icon">${roomMarks[d.type]}</span><h2>${roomLabels[d.type]}${d.boss?' · 最终战':''}</h2><b>${d.name}</b><p>${d.type==='combat'?'清除敌人 · 30 金币 + 卡牌三选一':d.type==='rest'?'安全休息 · 恢复最多 35 生命':'占位事件 · 安全继续'}</p><span class="door-cta">进入第 ${d.number} 房 →</span></button>`).join('')}</div><p class="forge-foot">已完成 ${run.path.length} / 10 · 牌组 ${run.loadout.length} 张 · 金币 ${run.coins} · 生命 ${run.hp} / 100</p></section>`;
}
function showRest(){hero.hp=run.hp;hero.shield=0;setScreen('rest');overlay.innerHTML=`<section class="modal-wrap"><div class="eyebrow">ROOM ${run.pending.number} / 10 · REST</div><h1>${run.pending.name}</h1><p class="lead">休息点占位 · 当前生命 ${run.hp} / 100。</p><div class="notice">在安静的房间中修复回路，恢复最多 35 生命。完成后可以打开牌组，或选择下一扇门。</div><button class="btn primary" data-action="rest">休息并恢复生命</button></section>`;}
function showEvent(){hero.hp=run.hp;hero.shield=0;setScreen('event');overlay.innerHTML=`<section class="modal-wrap"><div class="eyebrow">ROOM ${run.pending.number} / 10 · EVENT</div><h1>${run.pending.name}</h1><p class="lead">事件占位 · 这里将发生一段未知的遭遇。</p><div class="notice">当前阶段不改变生命、金币或牌组。完成事件后，出口与牌组操作开放。</div><button class="btn primary" data-event="continue">完成事件 · 继续</button></section>`;}
function openBuild(){if(!run||!['cleared','victory'].includes(screen)||!G.canManage(run)){toast('完成当前房间后才能操作牌组');return false;}buildReturn=screen;buildSelected=[];buildPreview=null;setScreen('build');renderBuild();return true;}
function selectBuild(index){if(screen!=='build'||!run.loadout[index])return;buildPreview=null;const existing=buildSelected.indexOf(index);if(existing>=0)buildSelected.splice(existing,1);else if(buildSelected.length<2)buildSelected.push(index);else buildSelected=[index];renderBuild();}
function workshopPreview(type){
 if(screen!=='build'||!G.canManage(run))return false;const [a,b]=buildSelected;
 if(type==='transform'){if(buildSelected.length!==1){toast('变牌需选择一张卡牌');return false;}if(run.coins<30){toast('金币不足，需要 30 金币');return false;}}
 else if(type==='splice'){const rule=G.spliceRule(run,a,b);if(!rule.ok){toast(rule.reason);return false;}}else return false;
 buildPreview={type,ids:buildSelected.map(i=>run.loadout[i].id)};renderBuild();return true;
}
function commitWorkshop(){
 if(screen!=='build'||!buildPreview)return false;const {type,ids}=buildPreview,indices=ids.map(id=>run.loadout.findIndex(c=>c.id===id));
 const result=type==='transform'?G.transform(run,indices[0]):G.splice(run,...indices);buildPreview=null;
 if(!result.ok){toast(result.reason);renderBuild();return false;}noticeText=(type==='transform'?'变牌':'拼接')+'完成：'+Deck.spec(result.card).name+'，本次探索内永久保留。';buildSelected=[];toast(noticeText);renderBuild();return true;
}
function renderBuild(){
 const [a,b]=buildSelected,primary=run.loadout[a],secondary=run.loadout[b],spliceRule=G.spliceRule(run,a,b);let preview='';
 if(buildPreview){
  const combined=buildPreview.type==='splice'?Deck.spec({kind:'splice',traits:[...Deck.effects(primary),...Deck.effects(secondary)],spliced:true,level:0}):null;
  preview=`<div class="notice" role="status"><b>${combined?'拼接预览：'+combined.name:'变牌预览：'+Deck.spec(primary).name+' → 其他随机基础牌'}</b><p>${combined?describeCard(combined)+'；CD '+combined.cd+'s'+(combined.exhaust?'；使用后本场耗尽':''):'结果不会与原牌相同；现有词条将由新牌词条替换。'}</p><p>${combined?'消耗两张素材，生成一张牌；产物暂不能再次拼接。':'消耗 30 金币，牌组张数不变。'}变更在本次探索内永久保留。</p><div class="actions"><button class="btn primary" data-workshop="confirm">确认${combined?'拼接 · 50':'变牌 · 30'} 金币</button><button class="btn ghost" data-workshop="cancel">取消</button></div></div>`;
 }
 overlay.innerHTML=`<section class="sector workshop"><header class="page-head"><div><div class="eyebrow">ROOM WORKSHOP / 本次探索</div><h1>牌组整备</h1><p>选择 1 张变牌，或选择 2 张不同类型的基础牌拼接。</p></div><button class="btn" data-action="close-build">返回房间</button></header><div class="forge-summary"><b>金币 ${run.coins}</b><span>牌组 ${run.loadout.length} 张 · 至少保留 5 张 · 已选 ${buildSelected.length} 张</span></div><div class="workshop-actions"><button class="btn" data-workshop="transform" ${buildSelected.length===1&&run.coins>=30?'':'disabled'}>变牌 · 30 金币</button><button class="btn accent" data-workshop="splice" title="${spliceRule.ok?'':spliceRule.reason}" ${spliceRule.ok?'':'disabled'}>拼接 · 50 金币</button><button class="btn ghost" data-workshop="clear">清空选择</button></div>${preview||'<p class="forge-foot">变牌随机变成另一张基础牌；拼接随机继承两张素材各一个词条。当前占位牌各含一个词条。</p>'}<div class="loadout-grid">${run.loadout.map((base,i)=>{const c=Deck.spec(base),selected=buildSelected.includes(i);return `<button class="loadout-card ${selected?'selected':''}" data-build-card="${i}" aria-label="牌组第 ${i+1} 张 ${c.name}" aria-pressed="${selected}" style="--card-color:${color(c)}"><div class="loadout-heading"><span>卡牌 ${String(i+1).padStart(2,'0')}</span><b>${selected?'已选择':c.spliced?'已拼接':'基础牌'}</b></div><h2>${c.name}</h2><p>${describeCard(c)}</p><div class="card-budget"><span>CD ${c.cd}s</span><span>${c.spliced?'不能再次拼接':c.exhaust?'本场一次':'可重复施放'}</span></div></button>`;}).join('')}</div><p class="forge-foot">这里的变牌与拼接保留到本次探索结束。战斗中临时融合的 +1 / +2 不会写入此牌组。</p></section>`;updateUI();
}
function openDeckView(){if(screen!=='battle'||!deck)return;if(deckViewerOpen){closeBuild();return;}deckViewerOpen=true;viewerSignature='';refreshDeckViewer();}
function refreshDeckViewer(){
 if(screen!=='battle'||!deckViewerOpen||!deck)return;
 const zones=[['手牌',deck.hand],['抽牌区 / 候选区',deck.candidates],['抽牌堆',deck.draw],['弃牌堆',deck.discard],['耗尽区',deck.exhausted]],signature=JSON.stringify([slow,zones.map(([name,cards])=>[name,cards.map(c=>[c.id,c.name,c.cooldown.toFixed(1)])])]);if(signature===viewerSignature)return;viewerSignature=signature;
 auxiliary.innerHTML='<nav class="battle-nav"><button class="btn" data-action="view-deck">关闭牌组 [B]</button><button class="btn ghost" data-action="pause">暂停</button></nav>'+`<aside class="deck-viewer"><header><b>本场牌组 · ${run.loadout.length} 张</b><button class="btn" data-action="close-build">关闭</button></header><p>${slow?'时停中，世界仍冻结。':'实时战斗继续。'}融合只在本场有效，卡牌操作请回到下方牌区。</p>${zones.map(([name,cards])=>`<h3>${name} · ${cards.length}</h3>${cards.length?cards.map(c=>`<div><span>${c.name}</span><small>${c.cooldown>0?c.cooldown.toFixed(1)+'s':'就绪'}</small></div>`).join(''):'<p>暂无卡牌</p>'}`).join('')}</aside>`;
}
function closeBuild(){if(screen==='battle'&&deckViewerOpen){battleNav();return;}if(screen!=='build')return;buildSelected=[];buildPreview=null;buildReturn==='victory'?showVictory():showCleared();}
function pause(){if(screen!=='battle')return;setScreen('pause');overlay.innerHTML='<section class="modal-wrap"><div class="eyebrow">PAUSED</div><h1>战斗已暂停</h1><p class="lead">手牌、抽牌区、冷却与回路保持不变。</p><button class="btn primary" data-action="resume">继续战斗</button></section>';}
function resume(){if(screen!=='pause')return;setScreen('battle');battleNav();}
function defeat(){resetBattle();deck=null;skills=[];setScreen('defeat');overlay.innerHTML='<section class="modal-wrap"><div class="eyebrow">CIRCUIT INTERRUPTED</div><h1>回路过载</h1><p class="lead">重试当前房间，保留之前获得的卡牌与牌组变更；本场临时融合重置。</p><div class="actions"><button class="btn primary" data-action="retry">重新挑战</button><button class="btn ghost" data-action="menu">主菜单</button></div></section>';}
function showVictory(){hero.hp=run.hp;setScreen('victory');overlay.innerHTML=`<section class="modal-wrap"><div class="eyebrow">EXPEDITION COMPLETE</div><h1>十房探索完成</h1><p class="lead">最后的战斗与奖励已结算，你走出了回路地牢。</p><div class="run-summary"><div><strong>10 / 10</strong><small>完成房间</small></div><div><strong>5 · 3 · 2</strong><small>战斗 / 事件 / 休息</small></div><div><strong>${run.coins}</strong><small>剩余金币</small></div><div><strong>${run.loadout.length}</strong><small>牌组张数</small></div></div><div class="actions"><button class="btn primary" data-action="new">再次探索</button><button class="btn" data-action="build">查看与整理牌组</button><button class="btn ghost" data-action="menu">主菜单</button></div></section>`;}
function help(){setScreen('help');overlay.innerHTML=`<section class="modal-wrap"><div class="eyebrow">FIELD MANUAL</div><h1>操作指南</h1><div class="help-box"><b>五张手牌</b><p>牌组初始有 10 张牌，五种基础牌各两张。首场手牌每种一张，后续战斗随机抽 5 张。攻击、防御、位移、debuff 牌可冷却后重复使用；一次性卡牌和含该词条的拼接牌使用后本场耗尽，下场恢复。</p><b>即时战斗</b><p>点地面移动，鼠标调整方向。Q W E R T / 1—5 选牌，再按同键或点“施放选中牌”。红色区域为敌人攻击预警。攻击、击败、躲避、护盾吸收等行为积累回路。</p><b>自由时停</b><p>每场开场时停，获得 100 回路。空格随时进入或退出，Esc 退出时停。开关免费，保留余额、手牌和抽牌区；回路为零仍可时停。世界、角色、状态与冷却冻结，不能移动或施法。</p><b>抽牌、交换、融合</b><p>花 20 回路抽 1 张，放入手牌上方的抽牌区，上限 5 张。满区时先选定要替换的候选牌；旧牌进入弃牌堆。牌堆为空会洗回弃牌。所有可用牌都在两排时，替换可能重新抽回同一张牌。</p><p>选候选牌与手牌可免费交换，换出牌留在抽牌区；手牌有空位时可直接收入。同基础名称可再花 20 回路融合，素材本场耗尽、手牌 +1，最高 +2，每级主要数值 +25%。换牌和融合保留冷却。强化仅本场有效。</p><b>十个房间</b><p>全程 5 战斗、3 事件、2 休息，第一与最后一房为战斗。每个房间完成后选择出口，不显示地图。每战获得 30 金币与卡牌三选一；事件暂为占位，休息恢复最多 35 生命。</p><b>金币牌组操作</b><p>房间完成后、选择出口前打开牌组。变牌花 30 金币：选一张牌，随机变成不同的基础牌。拼接花 50 金币：选择两种不同基础牌，各随机继承一个词条，形成一张新牌；当前每张占位牌只有一个词条。拼接牌不能再次拼接，冷却取两种词条较长值，牌组至少留 5 张。</p><p>变牌和拼接在本次十房探索内永久保留，刷新页面会重开。按 B 查看战斗牌组，或在已完成房间打开牌组工坊。触屏可通过卡牌和按钮操作。</p></div><button class="btn primary" data-action="menu">返回主菜单</button></section>`;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.reward&&screen==='reward'){if(G.claim(run,b.dataset.reward)){noticeText='奖励已加入牌组。可以整备后再选择出口。';run.won?showVictory():showCleared();}return;}
 if(b.dataset.event&&screen==='event'){if(G.event(run,b.dataset.event)){noticeText='事件已完成。';showCleared();}return;}
 if(b.dataset.door&&screen==='cleared'){if(G.enter(run,b.dataset.door)){noticeText='';openEncounter();}return;}
 if(b.dataset.buildCard!==undefined){selectBuild(+b.dataset.buildCard);return;}
 if(b.dataset.workshop&&screen==='build'){switch(b.dataset.workshop){case'transform':case'splice':workshopPreview(b.dataset.workshop);break;case'confirm':commitWorkshop();break;case'cancel':buildPreview=null;renderBuild();break;case'clear':buildSelected=[];buildPreview=null;renderBuild();break;}return;}
 switch(b.dataset.action){case'new':newRun();break;case'menu':menu();break;case'help':help();break;case'rest':if(screen==='rest'&&G.rest(run)){noticeText='休息完成，生命已恢复。';showCleared();}break;case'build':openBuild();break;case'view-deck':openDeckView();break;case'close-build':closeBuild();break;case'pause':pause();break;case'resume':resume();break;case'retry':if(screen==='defeat')startBattle();break;}
});
menu();

</script>
</body></html>
